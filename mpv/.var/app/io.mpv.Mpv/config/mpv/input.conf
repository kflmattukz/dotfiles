# PotPlayer-style keys. Every action shows a top-left message (osd styled in mpv.conf).
# Seek message: "» +5s   00:12:34 / 00:24:00  (52%)"

SPACE        cycle pause; show-text "${?pause==yes:❚❚  Paused}${?pause==no:▶  Play}"
MBTN_LEFT    cycle pause; show-text "${?pause==yes:❚❚  Paused}${?pause==no:▶  Play}"
MBTN_LEFT_DBL cycle fullscreen; show-text "${?fullscreen==yes:Fullscreen}${?fullscreen==no:Window}"
ENTER        cycle fullscreen; show-text "${?fullscreen==yes:Fullscreen}${?fullscreen==no:Window}"
ESC          set fullscreen no

LEFT         seek -5;  show-text "« -5s    ${time-pos} / ${duration}  (${percent-pos}%)"
RIGHT        seek 5;   show-text "» +5s    ${time-pos} / ${duration}  (${percent-pos}%)"
Ctrl+LEFT    seek -30; show-text "« -30s    ${time-pos} / ${duration}  (${percent-pos}%)"
Ctrl+RIGHT   seek 30;  show-text "» +30s    ${time-pos} / ${duration}  (${percent-pos}%)"
Alt+LEFT     seek -60; show-text "« -60s    ${time-pos} / ${duration}  (${percent-pos}%)"
Alt+RIGHT    seek 60;  show-text "» +60s    ${time-pos} / ${duration}  (${percent-pos}%)"

UP           add volume 5;  show-text "Volume  ${volume}%"
DOWN         add volume -5; show-text "Volume  ${volume}%"
WHEEL_UP     add volume 5;  show-text "Volume  ${volume}%"
WHEEL_DOWN   add volume -5; show-text "Volume  ${volume}%"
m            cycle mute; show-text "${?mute==yes:Muted}${?mute==no:Volume  ${volume}%}"
MBTN_MID     cycle mute; show-text "${?mute==yes:Muted}${?mute==no:Volume  ${volume}%}"

PGUP         playlist-prev; show-text "Previous  ·  ${playlist-pos-1} / ${playlist-count}"
PGDWN        playlist-next; show-text "Next  ·  ${playlist-pos-1} / ${playlist-count}"

d            frame-back-step; show-text "Frame back  ${time-pos/full}"
f            frame-step;      show-text "Frame  ${time-pos/full}"
x            add speed -0.1;  show-text "Speed  ${speed}x"
c            add speed 0.1;   show-text "Speed  ${speed}x"
z            set speed 1.0;   show-text "Speed  1x"

Alt+l        cycle sub;            show-text "Subtitle  ${?sid==no:off}${!sid==no:${current-tracks/sub/lang:} ${current-tracks/sub/title:}}"
Alt+h        cycle sub-visibility; show-text "${?sub-visibility==yes:Subtitles shown}${?sub-visibility==no:Subtitles hidden}"
Alt+s        script-binding sub_style/menu
<            add sub-delay -0.5;   show-text "Subtitle delay  ${sub-delay}"
>            add sub-delay 0.5;    show-text "Subtitle delay  ${sub-delay}"
Ctrl+Alt+LEFT  add audio-delay -0.05; show-text "Audio delay  ${audio-delay}"
Ctrl+Alt+RIGHT add audio-delay 0.05;  show-text "Audio delay  ${audio-delay}"
Alt+a        cycle audio; show-text "Audio  ${current-tracks/audio/lang:} ${current-tracks/audio/title:${current-tracks/audio/codec}}"

Alt+i        script-binding motion_toggle/cycle
Alt+k        cycle-values video-rotate 90 180 270 0; show-text "Rotate  ${video-rotate}°"
Ctrl+z       script-binding flip/hflip
Ctrl+p       script-binding flip/vflip

Ctrl+s       screenshot; show-text "Screenshot saved  ~/Pictures/mpv"
MBTN_RIGHT   script-binding uosc/menu
TAB          script-binding playlist_sidebar/toggle
