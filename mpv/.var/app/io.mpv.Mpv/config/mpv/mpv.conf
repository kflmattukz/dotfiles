# ---------- UI (uosc draws everything) ----------
osc=no
osd-bar=no
border=no                  # uosc title bar + window controls (top-left)
cursor-autohide=1000
keep-open=yes              # stay on last frame instead of closing
autofit-larger=80%x80%
geometry=50%:50%

# ---------- Quality / decoding ----------
# profile=high-quality was too heavy for the Intel UHD 620 (~50ms/frame -> ~25% frames dropped).
# spline36 keeps upscaling sharp at ~8ms/frame with zero drops.
vo=gpu-next
hwdec=auto-safe
scale=spline36
cscale=spline36
dscale=mitchell

# ---------- Color: subtle boost (measured ~0 GPU cost, 0 drops) ----------
saturation=8               # slightly richer colors
contrast=4                 # a touch more depth
gamma=-2                   # slightly deeper midtones
deband=yes                 # smooth color banding in skies/gradients (light 1-pass)
deband-iterations=1
deband-threshold=32

# ---------- Autoload: playlist = all videos in the opened file's folder ----------
autocreate-playlist=filter
directory-filter-types=video
directory-mode=ignore      # files only: don't add subfolders to the playlist

# ---------- PotPlayer-like memory ----------
save-position-on-quit=yes
watch-later-options-remove=volume   # volume is global, see scripts/remember-volume.lua
watch-later-options-remove=mute
volume-max=150

# ---------- Subtitles / audio ----------
sub-auto=fuzzy
slang=id,ind,en,eng
alang=ja,jpn,en,eng

# ---------- Screenshots ----------
screenshot-dir=~/Pictures/mpv
screenshot-format=png

# ---------- OSD messages: top-left ----------
osd-align-x=left
osd-align-y=top
osd-margin-x=32
osd-margin-y=32
osd-font='Geist Medium'
osd-font-size=22
osd-bold=no
osd-border-size=1
osd-shadow-offset=0
osd-color='#E6E6E6'
osd-border-color='#1a1b26'
osd-duration=1200
