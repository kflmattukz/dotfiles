# ---------- UI (uosc draws everything) ----------
osc=no
osd-bar=no
border=no                  # uosc title bar + window controls (top-left)
cursor-autohide=1000
keep-open=yes              # stay on last frame instead of closing
autofit-larger=80%x80%
geometry=50%:50%

# ---------- Quality / decoding ----------
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# ---------- Autoload: playlist = all videos in the opened file's folder ----------
autocreate-playlist=filter
directory-filter-types=video

# ---------- PotPlayer-like memory ----------
save-position-on-quit=yes
watch-later-options-remove=volume   # volume is global, see scripts/remember-volume.lua
watch-later-options-remove=mute
volume-max=150

# ---------- Subtitles / audio ----------
sub-auto=fuzzy
slang=id,ind,en,eng
alang=ja,jpn,en,eng

# ---------- Screenshots ----------
screenshot-dir=~/Pictures/mpv
screenshot-format=png

# ---------- OSD messages: top-left ----------
osd-align-x=left
osd-align-y=top
osd-margin-x=32
osd-margin-y=32
osd-font='Geist Medium'
osd-font-size=22
osd-bold=no
osd-border-size=1
osd-shadow-offset=0
osd-color='#E6E6E6'
osd-border-color='#1a1b26'
osd-duration=1200

# ---------- Motion modes (Alt+i cycles: off → smooth → rife, see scripts/motion-toggle.lua) ----------
[smooth]
profile-desc=Smooth motion: blends frames to the display refresh, kills 24-on-60 judder (no new frames)
profile-restore=copy
video-sync=display-resample
interpolation=yes
tscale=oversample

[rife]
profile-desc=RIFE AI frame interpolation via VapourSynth (settings in vapoursynth/rife.vpy)
profile-restore=copy
hwdec=auto-copy-safe        # VapourSynth needs frames in RAM; still decoded on the GPU
video-sync=display-resample
interpolation=no
vf-append=@rife:vapoursynth="~~/vapoursynth/rife.vpy":buffered-frames=8
