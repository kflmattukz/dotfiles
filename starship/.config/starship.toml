"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 1000

format = """
[](fg:#7aa2f7)$os$username[](bg:#bb9af7 fg:#7aa2f7)$directory[](fg:#bb9af7 bg:#394260)$git_branch$git_status[](fg:#394260 bg:#212736)\
$nodejs$bun$java$golang$rust$elixir$gleam$erlang$docker_context[](fg:#212736 bg:#1d2230)$cmd_duration[ ](fg:#1d2230)
$character"""

[os]
disabled = false
style = "bg:#7aa2f7 fg:#1a1b26"
format = "[ $symbol]($style)"
[os.symbols]
Fedora = " "

[username]
show_always = false
style_user = "bg:#7aa2f7 fg:#1a1b26"
format = "[$user ]($style)"

[directory]
style = "bg:#bb9af7 fg:#1a1b26 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Projects" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#394260 fg:#7dcfff"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#394260 fg:#e0af68"
format = "[($all_status$ahead_behind )]($style)"

[nodejs]
symbol = ""
style = "bg:#212736 fg:#9ece6a"
format = "[ $symbol ($version) ]($style)"

[bun]
symbol = ""
style = "bg:#212736 fg:#f7768e"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = ""
style = "bg:#212736 fg:#ff9e64"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:#212736 fg:#7dcfff"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:#212736 fg:#f7768e"
format = "[ $symbol ($version) ]($style)"

[elixir]
symbol = ""
style = "bg:#212736 fg:#bb9af7"
format = "[ $symbol ($version) ]($style)"

[gleam]
symbol = "󰦥"
style = "bg:#212736 fg:#ff79c6"
format = "[ $symbol ($version) ]($style)"

[erlang]
symbol = ""
style = "bg:#212736 fg:#f7768e"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = ""
style = "bg:#212736 fg:#7aa2f7"
format = "[ $symbol $context ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:#1d2230 fg:#a9b1d6"
format = "[ 󱦟 $duration ]($style)"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #7aa2f7)"
